# Render free tier.  No disk - free services do not support one - which is fine
# because the dashboard does not need market-data panels: it reads the decision
# GitHub Actions publishes twice a day.  Trading happens in Actions; this is the
# viewer, so a service that sleeps when idle costs nothing.
services:
  - type: web
    name: btcusdt-book
    runtime: docker
    dockerfilePath: ./research/btcusdt-quant/webapp/Dockerfile
    dockerContext: ./research/btcusdt-quant
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: BOT_MODE
        value: paper           # the viewer never places orders
      - key: BOOK_STORE
        value: /tmp/book       # ephemeral, and unused when STATUS_URL is set
      - key: HOST
        value: 0.0.0.0
      - key: STATUS_URL
        value: https://raw.githubusercontent.com/shreyasbangera/SplitEase/main/research/btcusdt-quant/status/latest.json
      - key: APP_USER
        value: trader
      - key: APP_PASSWORD
        generateValue: true    # Render generates one; read it in the Environment tab
